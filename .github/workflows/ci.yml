name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Align golangci-lint version with tools.mk
        id: golangci-version
        run: |
          VERSION=$(grep '^GOLANGCI_LINT_VERSION' tools.mk | cut -d'=' -f2 | tr -d ' ?')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: ${{ steps.golangci-version.outputs.version }}

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck (non-blocking until Go toolchain is bumped)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./... || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test-unit

      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ai-gateway-controller-coverage
          path: |
            coverage.out
            coverage.html
          retention-days: 30

  test-envtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify vendored CRDs match their pins
        working-directory: test/envtest/testdata/crds
        run: sha256sum --check --strict SHA256SUMS

      - name: Test control-plane scenarios
        run: make test-envtest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build manager binary
        # strictfipsruntime is a Red Hat UBI go-toolset experiment; stock
        # actions/setup-go does not support it.
        env:
          GO_STRICTFIPS: "false"
        run: make binary

  verify-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Re-run vendoring and check for drift
        run: |
          ./hack/scripts/get-manifests.sh
          if ! git diff --quiet -- config/manifests/praxis-extproc; then
            echo "ERROR: config/manifests/praxis-extproc is out of date with the commit pinned in hack/scripts/get-manifests.sh." >&2
            echo "Run 'make get-manifests' locally and commit the result." >&2
            git diff --stat -- config/manifests/praxis-extproc
            exit 1
          fi

  verify-api-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify generated API artifacts
        run: |
          make manifests
          if ! git diff --quiet -- . || [ -n "$(git status --short --untracked-files=all)" ]; then
            echo "ERROR: generated API artifacts are out of date." >&2
            echo "Run 'make manifests' locally and commit the generated changes." >&2
            git diff --stat -- .
            git status --short --untracked-files=all
            exit 1
          fi

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # shellcheck ships preinstalled on the ubuntu-latest runner image.
      - name: shellcheck
        run: find hack -name '*.sh' -print0 | xargs -0 -r shellcheck
