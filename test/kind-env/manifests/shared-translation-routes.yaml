apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-translation-messages
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/managed-by: api-translation-kind-e2e
spec:
  parentRefs:
    - name: maas-default-gateway
      namespace: maas-system
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/messages
      backendRefs:
        - name: translation-openai-mock
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-translation-openai
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/managed-by: api-translation-kind-e2e
spec:
  parentRefs:
    - name: maas-default-gateway
      namespace: maas-system
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/chat/completions
      backendRefs:
        - name: translation-openai-mock
          port: 8080
---
apiVersion: kuadrant.io/v1alpha1
kind: TokenRateLimitPolicy
metadata:
  name: api-translation-messages-rate-limit
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/managed-by: api-translation-kind-e2e
spec:
  limits:
    api-translation-messages:
      counters:
        - expression: auth.identity.userid
      rates:
        - limit: 100
          window: 1m
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: api-translation-messages
---
apiVersion: kuadrant.io/v1alpha1
kind: TokenRateLimitPolicy
metadata:
  name: api-translation-openai-rate-limit
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/managed-by: api-translation-kind-e2e
spec:
  limits:
    api-translation-openai:
      counters:
        - expression: auth.identity.userid
      rates:
        - limit: 100
          window: 1m
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: api-translation-openai
