# Kind-only route rate limiting. Authentication and model authorization are
# inherited from the MaaS-owned Gateway AuthPolicy, as for tenant A.
apiVersion: kuadrant.io/v1alpha1
kind: TokenRateLimitPolicy
metadata:
  name: external-model-rate-limit
  namespace: ai-tenant-tenant-b
  labels: {app.kubernetes.io/managed-by: local-env}
spec:
  limits:
    external-model:
      counters:
      - expression: auth.identity.userid
      rates:
      - limit: 10000
        window: 1m
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: external-model-demo-model
