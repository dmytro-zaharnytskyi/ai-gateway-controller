apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: provider-selection-api-to-fixture-postgres
  namespace: maas-system
  labels:
    external-model-e2e/purpose: provider-selection-proof
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: maas-api
      app.kubernetes.io/component: api
      app.kubernetes.io/part-of: models-as-a-service
      maas.opendatahub.io/tenant-instance: maas-api
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: maas-postgres
      ports:
        - protocol: TCP
          port: 5432
