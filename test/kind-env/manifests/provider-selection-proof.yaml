apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-selection-proof-a
  namespace: maas-system
  labels:
    app.kubernetes.io/managed-by: external-model-e2e
    external-model-e2e/purpose: provider-selection-proof
spec:
  replicas: 1
  selector:
    matchLabels: {app: provider-selection-proof-a}
  template:
    metadata:
      labels: {app: provider-selection-proof-a}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: recorder
        image: provider-recorder:issue28-kind
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        env:
        - {name: PROVIDER_NAME, value: proof-a}
        - {name: EXPECTED_HOST, value: provider-proof-a-ext.maas-system.svc.cluster.local}
        - {name: CREDENTIAL_FILE, value: /etc/provider-credentials/api-key}
        - {name: ENABLE_TEST_OBSERVATIONS, value: "true"}
        ports: [{name: https, containerPort: 8443}]
        readinessProbe:
          httpGet: {scheme: HTTPS, path: /healthz, port: https}
          periodSeconds: 2
        volumeMounts:
        - {name: tls, mountPath: /etc/provider/tls, readOnly: true}
        - {name: credential, mountPath: /etc/provider-credentials, readOnly: true}
        - {name: observations, mountPath: /var/run/provider-observations}
      volumes:
      - name: tls
        secret: {secretName: provider-proof-a-tls}
      - name: credential
        secret:
          secretName: provider-proof-a-backend-credential
          items: [{key: api-key, path: api-key}]
      - name: observations
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: provider-proof-a-ext
  namespace: maas-system
  labels: {app.kubernetes.io/managed-by: external-model-e2e}
spec:
  selector: {app: provider-selection-proof-a}
  ports: [{name: https, port: 443, targetPort: https}]
---
