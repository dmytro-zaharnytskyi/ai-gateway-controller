# Purpose: Attaches tenant A's token-rate-limit policy to its generated
# ExternalModel HTTPRoute. Authentication is supplied by MaaS's controller-
# owned Gateway AuthPolicy; this fixture must not install a competing route
# AuthPolicy.
#
# Scope: Kind E2E fixture only. This is not a production deployment manifest.
#
# Dependencies: Requires the models-as-a-service namespace, the MaaS API and
# Authorino/Kuadrant controllers, and the generated external-model-demo-model
# HTTPRoute from the tenant-A fixtures.
#
# Qualification role: Keeps tenant-A rate limiting active while the E2E
# exercises the controller-owned MaaS authentication policy.

apiVersion: kuadrant.io/v1alpha1
kind: TokenRateLimitPolicy
metadata:
  name: external-model-rate-limit
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/managed-by: local-env
spec:
  limits:
    external-model:
      counters:
        - expression: auth.identity.userid
      rates:
        - limit: 10000
          window: 1m
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: external-model-demo-model
