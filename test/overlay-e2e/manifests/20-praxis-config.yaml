# Static praxis pipeline for the overlay hot-swap e2e. Cluster names follow
# the reconciler's fixed convention provider-<ExternalProvider CR name>, so
# this file is exactly what a real gateway deployment's load_balancer section
# would look like for providers katan-a and katan-b. The overlay itself lives
# in the separate routing-overlay ConfigMap — never in here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-config
  namespace: overlay-e2e
data:
  praxis.yaml: |
    admin:
      address: "0.0.0.0:9901"

    insecure_options:
      allow_public_admin: true
      # The katan backends resolve to cluster-internal (pod CIDR) addresses.
      # Praxis refuses "sensitive" endpoints unless this is set — a real
      # finding for any deployment whose load_balancer clusters are in-cluster
      # services (dogfood runs everything on public hostnames, which is why
      # this never bit us there).
      allow_private_endpoints: true
      # Praxis core also gates hostnames that RESOLVE to private/reserved IPs
      # at connect time (DNS-rebinding/SSRF protection), separately from the
      # config-time endpoint check above. The katan service DNS names land in
      # the pod CIDR, so in-cluster load_balancer endpoints need both flags.
      allow_private_upstreams: true

    listeners:
      - name: proxy
        address: "0.0.0.0:8080"
        filter_chains:
          - main

    filter_chains:
      - name: main
        filters:
          - filter: json_body
            conditions:
            - unless:
              headers_present: ["X-Gateway-Model-Name"]
            request_extract:
              - pointer: /model
                header: X-Gateway-Model-Name
            on_invalid: continue

          - filter: intelligent_route
            overlay_file: /etc/praxis/routing/routing-overlay.json
            model_header: X-Gateway-Model-Name
            reload:
              enabled: true
              debounce_ms: 500

          # Mirrors what pkg/tenant/extproc.go renders in production: one
          # entry per provider Secret, each carrying the strategy the
          # overlay candidates resolve to. The overlay's anthropic+messages
          # candidates carry strategy apikey, so these entries must too —
          # praxis rejects any candidate whose strategy differs from the
          # configured entry (praxis-ai #1172 cross-check). The credential
          # files are projected by the Deployment from the katan-*-key
          # Secrets run.sh creates.
          - filter: credential_inject
            credentials:
              - name: katan-a-key
                namespace: overlay-e2e
                key: api-key
                file: /etc/praxis/credentials/katan-a-key/api-key
                strategy: apikey
              - name: katan-b-key
                namespace: overlay-e2e
                key: api-key
                file: /etc/praxis/credentials/katan-b-key/api-key
                strategy: apikey

          - filter: load_balancer
            clusters:
              - name: provider-katan-a
                endpoints:
                  - "katan-a.overlay-e2e.svc.cluster.local:8000"
              - name: provider-katan-b
                endpoints:
                  - "katan-b.overlay-e2e.svc.cluster.local:8000"

    shutdown_timeout_secs: 5
