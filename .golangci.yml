version: "2"
run:
  timeout: 8m
  build-tags: [envtest]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  default: all
  disable:
    - cyclop
    - depguard
    - dupl
    - embeddedstructfieldcheck
    - err113
    - exhaustruct
    - forbidigo
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - godot
    - godox
    - gomoddirectives
    - intrange
    - maintidx
    - mnd
    - modernize
    - nestif
    - nilnil
    - nlreturn
    - nonamedreturns
    - paralleltest
    - prealloc
    - tagliatelle
    - testpackage
    - unparam
    - unused
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
    - funcorder
    - godoclint
    - noinlineerr
    - testifylint
  settings:
    errcheck:
      check-type-assertions: true
    exhaustive:
      check:
        - switch
      default-signifies-exhaustive: true
    funlen:
      lines: 100
      statements: 100
      ignore-comments: true
    goconst:
      ignore-string-values:
        - "true"
        - "false"
    gocritic:
      enabled-checks:
        - deferInLoop
        - unnecessaryDefer
      disabled-checks:
        - ifElseChain
    gocyclo:
      min-complexity: 40
    importas:
      alias:
        - pkg: k8s.io/api/(\w{1,4})\w*/(v[\w\d]+)
          alias: $1$2
    lll:
      line-length: 220
    nolintlint:
      require-specific: true
      allow-no-explanation:
        - funlen
        - lll
    perfsprint:
      sprintf1: false
      strconcat: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
        path: _test\.go
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/opendatahub-io/ai-gateway-controller/)
        - blank
        - dot
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - ^evidence/
