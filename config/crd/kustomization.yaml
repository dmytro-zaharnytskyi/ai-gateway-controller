apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Development/test packaging: every CRD this repo reads, in one place. The
# aigateway group lives in config/self/crd because the self bundle installs it;
# the inference CRDs are installed by maas-controller, not from here.

resources:
  - ../self/crd
  - bases/inference.opendatahub.io_externalmodels.yaml
  - bases/inference.opendatahub.io_externalproviders.yaml
